[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "throughline"
version = "0.5.0"
description = "Analysis and design artifact pipeline anchored in a repository"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
throughline = "throughline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

# The app is served from inside the package, so its files have to ship
# with it. Without this a non-editable install has a working CLI and a
# `serve` command that 404s on every asset.
[tool.setuptools.package-data]
throughline = ["app/*", "app/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
