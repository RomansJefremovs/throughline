# The suite touches no network and needs no services - every test builds
# what it needs in a temporary directory - so this is the whole of CI.
name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    # Windows because that is what the app ships on, and because the two
    # bugs CI would most plausibly have caught - a .CMD that CreateProcess
    # will not start, and an mtime tie between two writes - are both
    # Windows behaviours that a Linux runner would sail straight past.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q
